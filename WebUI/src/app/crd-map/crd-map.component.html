<div *ngIf="false" class="mb-4 flex gap-2">
    <button class="filter-btn" (click)="applyFilter('all')">All</button>
    <button class="filter-btn" (click)="applyFilter('valid')">Published</button>
    <button class="filter-btn" (click)="applyFilter('expired')">Expired</button>
    <button class="filter-btn" (click)="applyFilter('notPublished')">Not Published</button>
  </div>
  <div class="grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6 text-sm max-h-[90vh] overflow-hidden">
    <div class="bg-white shadow rounded p-4 text-center">
      <div class="text-lg font-semibold text-gray-800">{{ metrics.total }}</div>
      <div class="text-gray-500">Total Districts</div>
    </div>
    <div class="bg-green-100 text-green-800 p-4 rounded shadow text-center">
      <div class="text-lg font-semibold">{{ metrics.valid }}</div>
      <div>Published/Valid</div>
    </div>
    <div class="bg-yellow-100 text-yellow-800 p-4 rounded shadow text-center">
      <div class="text-lg font-semibold">{{ metrics.expired }}</div>
      <div>Expired</div>
    </div>
    <div class="bg-red-100 text-red-800 p-4 rounded shadow text-center">
      <div class="text-lg font-semibold">{{ metrics.notPublished }}</div>
      <div>Not Published</div>
    </div>
    <div class="bg-blue-100 text-blue-800 p-4 rounded shadow text-center">
      <div class="text-lg font-semibold">{{ metrics.inWorkflow }}</div>
      <div>Under Review</div>
    </div>
    <div class="bg-indigo-100 text-indigo-800 p-4 rounded shadow text-center">
      <div class="text-lg font-semibold">{{ metrics.expiringSoon }}</div>
      <div>Expiring Soon</div>
    </div>
  </div>
  <!-- Responsive Map -->
  <div id="map" class="w-full min-h-[300px] h-[70vh] rounded shadow border overflow-hidden"></div>
