<div class="p-6">
  <h1 class="text-2xl font-bold mb-4">Create Workflow with Steps and Substeps</h1>
  <form [formGroup]="workflowForm" (ngSubmit)="submitWorkflow()">
    <input formControlName="name" placeholder="Workflow Name" class="border p-2 mb-4 w-full rounded" />

    <div formArrayName="steps">
      <div *ngFor="let step of steps.controls; let i = index" [formGroupName]="i" class="border p-4 mb-4 rounded">
        <input formControlName="name" placeholder="Step Name" class="border p-2 w-full mb-2 rounded" />
        <input formControlName="assignedToRoles" placeholder="Assigned Roles (comma-separated)" class="border p-2 w-full mb-2 rounded" />

        <div formArrayName="subSteps">
          <div *ngFor="let subStep of getSubSteps(i).controls; let j = index" [formGroupName]="j" class="ml-4 border p-2 rounded mb-2">
            <input formControlName="name" placeholder="Substep Name" class="border p-2 w-full mb-1 rounded" />
            <input formControlName="assignedToRoles" placeholder="Assigned Roles (comma-separated)" class="border p-2 w-full mb-1 rounded" />
          </div>
          <button type="button" (click)="addSubStep(i)" class="text-blue-600 text-sm">+ Add Substep</button>
        </div>
      </div>
      <button type="button" (click)="addStep()" class="text-green-600 text-sm">+ Add Step</button>
    </div>

    <button type="submit" class="mt-6 px-6 py-2 bg-blue-600 text-white rounded">Submit Workflow</button>
  </form>
</div>
