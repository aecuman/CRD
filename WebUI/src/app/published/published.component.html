<div class="p-6 bg-white shadow rounded-lg">
    <h2 class="text-xl font-semibold mb-4">Published Rates Summary</h2>
  
<!-- -->    <div class="flex flex-wrap gap-3 mb-4">
      <button class="px-3 py-1 bg-blue-100 text-blue-800 rounded text-sm font-medium hover:bg-blue-200" [ngClass]="{'bg-blue-600 text-white':filter==='all'}" (click)="setFilter('all')">All</button>
      <button class="px-3 py-1 bg-blue-100 text-blue-800 rounded text-sm font-medium hover:bg-blue-200" [ngClass]="{'bg-blue-600 text-white':filter==='valid'}" (click)="setFilter('valid')">Valid</button>
      <button class="px-3 py-1 bg-blue-100 text-blue-800 rounded text-sm font-medium hover:bg-blue-200" [ngClass]="{'bg-blue-600 text-white':filter==='expired'}" (click)="setFilter('expired')">Expired</button>
      <button class="px-3 py-1 bg-blue-100 text-blue-800 rounded text-sm font-medium hover:bg-blue-200" [ngClass]="{'bg-blue-600 text-white':filter==='notPublished'}" (click)="setFilter('notPublished')">Not Published</button>
    </div> 
  
    <table class="w-full table-auto border-collapse shadow text-sm">
      <thead class="bg-gray-100 text-gray-700 font-semibold">
        <tr>
          <th class="p-3 text-left">District</th><!-- 
          <th class="p-3 text-left">Year</th>
          <th class="p-3 text-left">Workflow</th> -->
          <th class="p-3 text-left">Validity</th>
          <th class="p-3 text-left">Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of rates" class="hover:bg-gray-50 border-b">
          <td class="p-3">
            <a *ngIf="r.status=='Published'|| r.status=='Expired'" [routerLink]="['/portal/rates/published/',r.districtRateId]"
               class="text-blue-600 hover:underline">
              {{ r.districtName }}
            </a>
		<span *ngIf="r.status=='Not Published'">
              {{ r.districtName }}  
              </span>
          </td>
        <!--   <td class="p-3">{{ r.year || '—' }}</td>
          
          <td class="p-3">
            <span *ngIf="r.currentWorkflowStatus" class="text-blue-700 text-xs">
              🔄 {{ r.currentWorkflowStatusName }}
            </span>
            <span *ngIf="!r.currentWorkflowStatus" class="text-gray-400 text-xs">—</span>
          </td> -->
          <td class="p-3 text-xs text-gray-600">
            {{ r.validFrom | date:'yyyy' }} – {{ r.validTo | date:'yyyy' }}
          </td><td class="p-3">
            <span class="px-2 py-1 rounded text-xs font-medium" [ngClass]="getStatusColor(r.status??'')">
              {{ r.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  
    <div *ngIf="loading" class="text-center py-4 text-gray-500">Loading...</div>
    <div *ngIf="!loading && rates.length === 0" class="text-center py-4 text-gray-500">No records found.</div>
  </div>
