<div class="min-h-screen flex flex-col sm:justify-center items-center pt-6 sm:pt-0 bg-gray-100">
    <div>
      <div class="content-center">
        <div class="justify-center" style="padding-left: 30%;"><a href="/" style="display: inline-block;"><img
              src="assets/logo.png" width="150"></a></div>
        <div>
          <h1 class="text-3xl font-normal leading-normal mt-0 mb-2 text-grey-100">Compensation Rates Database</h1>
        </div>
      </div>
    </div>
    <div class="w-full sm:max-w-md mt-6 px-6 py-4 bg-white shadow-md overflow-hidden sm:rounded-lg"><!----><!---->
      <div *ngIf="errorMessage" class="mb-4">
        <div class="font-medium text-red-600"> Whoops! Something went wrong. </div>
        <ul class="mt-3 list-disc list-inside text-sm text-red-600">
          <li>{{errorMessage}}</li>
        </ul>
      </div>
      <form [formGroup]="LoginForm" novalidate (ngSubmit)="LoginForm.valid?login():isSubmitted=true" [noValidate]="true">
        <div>
          <label class="block font-medium text-sm text-gray-700" for="email"><span>Email</span></label>
          <input [ngClass]="{'is-invalid':(LoginForm.get('email')?.invalid||message)&&isSubmitted}" formControlName="email" class="border border-gray-300 focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 rounded-md shadow-sm mt-1 block w-full"
            id="email" type="email">
            <div *ngIf="LoginForm?.get('email')?.invalid&&LoginForm?.get('email')?.errors?.['required']" class="invalid-feedback">
              Email is required 
            </div>
        </div>
        <div class="mt-4">
          <label class="block font-medium text-sm text-gray-700" for="password"><span>Password</span></label>
          <div class="relative">
            <input [ngClass]="{'is-invalid':(LoginForm.get('password')?.invalid||message)&&isSubmitted}" formControlName="password" class="border border-gray-300 focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 rounded-md shadow-sm mt-1 block w-full pr-10"
              id="password" [type]="showPassword ? 'text' : 'password'">
            <button type="button" (click)="togglePasswordVisibility()" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
              <svg *ngIf="showPassword" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg *ngIf="!showPassword" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm5.31-7.78l3.15 3.15.02-.02c1.91 1.23 3.63 2.88 4.95 4.9 0 0-3.59-6.35-8.12-8.03z"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="block mt-4"><label class="flex items-center">
          <input  class="rounded border border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
            type="checkbox"  name="remember">
              <span class="ml-2 text-sm text-gray-600">Remember me</span>
            </label>
          </div>
        <div class="flex items-center justify-end mt-4">
        <button [disabled]="isLoading" type="submit" class="inline-flex items-center px-4 py-2 bg-gray-800 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-gray-700 active:bg-gray-900 focus:outline-none focus:border-gray-900 focus:ring focus:ring-gray-300 disabled:opacity-25 transition ml-4">
          <svg *ngIf="isLoading" width="20" height="20" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="40" stroke="#3498db" stroke-width="6" fill="none" stroke-linecap="round">
              <animate attributeName="stroke-dasharray" from="0,251.2" to="125.6,125.6" dur="1.5s" repeatCount="indefinite" />
              <animate attributeName="stroke-dashoffset" from="0" to="-251.2" dur="1.5s" repeatCount="indefinite" />
            </circle>
          </svg>
          {{isLoading?' Logging in ...':' Log in'}} 
          </button>
        </div>
      </form>
    </div>
  </div>
