<div class="min-h-screen flex flex-col sm:justify-center items-center pt-6 sm:pt-0 bg-gray-100">
    <div>
      <div class="content-center">
        <div class="justify-center" style="padding-left: 30%;"><a href="/" style="display: inline-block;"><img
              src="assets/logo.png" width="150"></a></div>
        <div>
          <h1 class="text-3xl font-normal leading-normal mt-0 mb-2 text-grey-100">Compensation Rates Database</h1>
        </div>
      </div>
    </div>
    <div class="w-full sm:max-w-md mt-6 px-6 py-4 bg-white shadow-md overflow-hidden sm:rounded-lg"><!----><!---->
      <div *ngIf="message" class="mb-4">
        <div class="font-medium text-red-600"> Whoops! Something went wrong. </div>
        <ul class="mt-3 list-disc list-inside text-sm text-red-600">
          <li>{{message}}</li>
        </ul>
      </div>
      <form [formGroup]="LoginForm" novalidate (ngSubmit)="LoginForm.valid?login():isSubmitted=true" [noValidate]="true">
        <div>
          <label class="block font-medium text-sm text-gray-700" for="email"><span>Email</span></label>
          <input [ngClass]="{'is-invalid':(LoginForm.get('email')?.invalid||message)&&isSubmitted}" formControlName="email" class="border border-gray-300 focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 rounded-md shadow-sm mt-1 block w-full"
            id="email" type="email">
            <div *ngIf="LoginForm?.get('email')?.invalid&&LoginForm?.get('email')?.errors?.['required']" class="invalid-feedback">
              Email is required 
            </div>
        </div>
        <div class="mt-4">
          <label class="block font-medium text-sm text-gray-700" for="password"><span>Password</span></label>
          <input [ngClass]="{'is-invalid':(LoginForm.get('password')?.invalid||message)&&isSubmitted}" formControlName="password" class="border border-gray-300 focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 rounded-md shadow-sm mt-1 block w-full"
            id="password" type="password"> 
          </div>
        <div class="block mt-4"><label class="flex items-center">
          <input  class="rounded border border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
            type="checkbox"  name="remember">
              <span class="ml-2 text-sm text-gray-600">Remember me</span>
            </label>
          </div>
        <div class="flex items-center justify-end mt-4">
        <button type="submit" class="inline-flex items-center px-4 py-2 bg-gray-800 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-gray-700 active:bg-gray-900 focus:outline-none focus:border-gray-900 focus:ring focus:ring-gray-300 disabled:opacity-25 transition ml-4">
           Log in 
          </button>
        </div>
      </form>
    </div>
  </div>
