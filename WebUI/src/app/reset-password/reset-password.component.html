<div class="flex justify-center items-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 shadow-lg rounded-lg w-96">
      <h2 class="text-2xl font-semibold mb-4 text-center">Reset Password</h2>
      <p class="text-gray-600 text-center mb-4">Enter your new password.</p>
  
      <form [formGroup]="resetForm" (ngSubmit)="submit()">
        <!-- New Password -->
        <div class="mb-4" *ngIf="!(loading||successMessage)">
          <label class="block text-gray-700">New Password</label>
          <div class="relative">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="w-full p-2 pr-10 border border-gray-300 rounded mt-1"
              [ngClass]="{'border-red-500': resetForm.get('password')?.touched && resetForm.get('password')?.invalid}" />
            <button type="button" (click)="togglePasswordVisibility()" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
              <svg *ngIf="showPassword" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg *ngIf="!showPassword" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm5.31-7.78l3.15 3.15.02-.02c1.91 1.23 3.63 2.88 4.95 4.9 0 0-3.59-6.35-8.12-8.03z"/>
              </svg>
            </button>
          </div>
            
            <p *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.hasError('required')" 
            class="text-red-500 text-sm mt-1">Password is required.</p>
          <p *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.hasError('minlength')" 
            class="text-red-500 text-sm mt-1">Password must be at least 6 characters.</p>
          <p *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.hasError('pattern')" 
            class="text-red-500 text-sm mt-1">Password must contain at least one digit and one special character.</p>
      
        </div>
  
        <!-- Confirm Password -->
        <div class="mb-4" *ngIf="!(loading||successMessage)">
          <label class="block text-gray-700">Confirm Password</label>
          <div class="relative">
            <input [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" class="w-full p-2 pr-10 border border-gray-300 rounded mt-1"
              [ngClass]="{'border-red-500': resetForm.get('confirmPassword')?.touched && resetForm.get('confirmPassword')?.invalid}" />
            <button type="button" (click)="toggleConfirmPasswordVisibility()" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700">
              <svg *ngIf="showConfirmPassword" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
              <svg *ngIf="!showConfirmPassword" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 001 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm5.31-7.78l3.15 3.15.02-.02c1.91 1.23 3.63 2.88 4.95 4.9 0 0-3.59-6.35-8.12-8.03z"/>
              </svg>
            </button>
          </div>
          
          <p *ngIf="resetForm.hasError('mismatch')" class="text-red-500 text-sm mt-1">
            Passwords do not match.
          </p>
        </div>
        <div *ngIf="loading" class="flex justify-center items-center">
          <svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="40" stroke="#3498db" stroke-width="6" fill="none" stroke-linecap="round">
              <animate attributeName="stroke-dasharray" from="0,251.2" to="125.6,125.6" dur="1.5s" repeatCount="indefinite" />
              <animate attributeName="stroke-dashoffset" from="0" to="-251.2" dur="1.5s" repeatCount="indefinite" />
            </circle>
          </svg>
          </div>
  
        <!-- Submit Button -->
        <button  type="submit" class="w-full bg-blue-500 text-white py-2 mt-4 rounded disabled:opacity-75" [disabled]="resetForm.invalid||loading">
          {{loading?'Resetting...':'Reset'}} Password
        </button>
      </form>
  
      <!-- Success & Error Messages -->
      <p *ngIf="successMessage" class="text-green-500 text-sm mt-4">{{ successMessage }}</p>
      <p *ngIf="errorMessage" class="text-red-500 text-sm mt-4">{{ errorMessage }}</p>
  
      <!-- Back to Login -->
      <p class="text-center text-sm mt-4">
        <a routerLink="/login" class="text-blue-500 hover:underline">Back to Login</a>
      </p>
    </div>
  </div>
