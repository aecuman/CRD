name: crd_mobile
description: Compensation Rate Database (CRD) Mobile App for viewing district statuses, approved rates, and performing moderation actions.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP networking
  http: ^1.2.1

  # Local storage for config / token
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.1

  # State management
  provider: ^6.1.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # PDF generation & file handling
  pdf: ^3.11.1
  path_provider: ^2.1.3
  open_file: ^3.5.4+2

  # Share / export
  share_plus: ^12.0.2

  # CSV export
  csv: ^6.0.0

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/districts.json
    - assets/logo.png
